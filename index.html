<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>តារាងមេលេខគុណ (ពីមេ ២ ដល់មេ ១០)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Khmer OS Battambang', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            min-height: 100vh;
            color: #f8fafc;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 1.6rem;
            color: #38bdf8;
            margin-bottom: 1.5rem;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        /* ប្រអប់បង្ហាញមេលេខនីមួយៗ */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .table-box {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }

        .table-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(56, 189, 248, 0.2);
        }

        h2 {
            font-size: 1.2rem;
            color: #facc15;
            margin-bottom: 12px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .math-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 10px;
            margin-bottom: 4px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .math-row span:last-child {
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔢 តារាងមេលេខគុណ (ពីមេ ២ ដល់មេ ១០)</h1>

        <div class="grid-container" id="multiplicationTables">
            <!-- មេលេខនឹងត្រូវបង្កើតដោយស្វ័យប្រវត្តិតាម JavaScript -->
        </div>
    </div>

    <script>
        const container = document.getElementById('multiplicationTables');

        // រង្វិលជុំបង្កើតមេលេខពី ២ ដល់ ១០
        for (let i = 2; i <= 10; i++) {
            let box = document.createElement('div');
            box.className = 'table-box';
            
            let htmlContent = `<h2>មេលេខ ${i}</h2>`;
            
            for (let j = 1; j <= 10; j++) {
                htmlContent += `
                    <div class="math-row">
                        <span>${i} × ${j} =</span>
                        <span>${i * j}</span>
                    </div>
                `;
            }
            
            box.innerHTML = htmlContent;
            container.appendChild(box);
        }
    </script>

</body>
</html>
