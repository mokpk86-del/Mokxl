<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Crystal Orb</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Khmer OS Battambang', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1e1b4b, #09090b);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* ផ្ទៃខាងក្រោយមានផ្កាយតូចៗព្រិចៗ */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(white 1px, transparent 0);
            background-size: 40px 40px;
            opacity: 0.15;
            animation: moveStars 20s linear infinite;
        }

        @keyframes moveStars {
            0% { transform: translateY(0); }
            100% { transform: translateY(40px); }
        }

        .container {
            text-align: center;
            z-index: 2;
        }

        /* ប្រអប់គ្រាប់កែវវេទមន្ត */
        .orb-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 2rem auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* រង្វង់ពន្លឺព័ទ្ធជុំវិញបែបអាគៀន */
        .orb-wrapper::before {
            content: '';
            position: absolute;
            inset: -15px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #38bdf8, #818cf8, #c084fc, #f43f5e, #38bdf8);
            animation: rotateGlow 3s linear infinite;
            filter: blur(10px);
            opacity: 0.7;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* គ្រាប់កែវគ្រីស្តាល់ខាងក្នុង */
        .crystal-orb {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.4), rgba(56, 189, 248, 0.2) 40%, rgba(15, 23, 42, 0.9) 80%);
            border-radius: 50%;
            position: relative;
            box-shadow: inset 0 0 30px rgba(56, 189, 248, 0.6), 0 0 40px rgba(192, 132, 252, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .crystal-orb:hover {
            transform: scale(1.05);
        }

        /* ថាមពលស្នូលខាងក្នុង */
        .core {
            width: 60px;
            height: 60px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 20px #fff, 0 0 40px #38bdf8, 0 0 60px #c084fc;
            animation: pulseCore 2s ease-in-out infinite alternate;
        }

        @keyframes pulseCore {
            0% { transform: scale(0.8); opacity: 0.6; filter: brightness(1); }
            100% { transform: scale(1.2); opacity: 1; filter: brightness(1.5); }
        }

        /* អត្ថបទបង្ហាញ */
        .title {
            color: #f8fafc;
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            letter-spacing: 1px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="orb-wrapper">
            <div class="crystal-orb" id="magicOrb">
                <div class="core"></div>
            </div>
        </div>
        <div class="title">គ្រីស្តាល់វេទមន្តកាឡាក់ស៊ី</div>
        <div class="subtitle" id="statusText">✨ សូមប៉ះលើគ្រាប់កែវដើម្បីដាស់ថាមពល!</div>
    </div>

    <script>
        const magicOrb = document.getElementById('magicOrb');
        const statusText = document.getElementById('statusText');

        const messages = [
            "✨ ថាមពលពន្លឺផ្កាយត្រូវបានដាស់ឡើង!",
            "🌌 ចក្រវាលកំពុងបញ្ចេញចរន្តអគ្គិសនី!",
            "💫 ភាពស្រស់ស្អាតនិងសន្តិភាពក្នុងកាឡាក់ស៊ី!",
            "🔮 ប៉ះម្តងទៀតដើម្បីប្តូរចរន្តថាមពល!"
        ];

        magicOrb.addEventListener('click', () => {
            // បង្កើតសំឡេងរំភើបស្រាលៗពេលប៉ះ
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch (e) {}

            // ប្តូរអត្ថបទចៃដន្យ
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            statusText.innerHTML = randomMsg;
        });
    </script>

</body>
</html>
