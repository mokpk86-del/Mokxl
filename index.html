<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>កម្មវិធីកំណត់ម៉ោងសិក្សា (Study Focus Timer)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Khmer OS Battambang', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f8fafc;
        }

        .study-container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        /* ផ្នែកនាឡិកា (Timer) */
        .timer-display {
            font-size: 3.5rem;
            font-weight: bold;
            margin: 1rem 0;
            color: #facc15;
            text-shadow: 0 0 20px rgba(250, 204, 21, 0.5);
        }

        .timer-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 2rem;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-start {
            background-color: #22c55e;
            color: white;
        }
        .btn-start:hover { background-color: #16a34a; }

        .btn-pause {
            background-color: #eab308;
            color: white;
        }
        .btn-pause:hover { background-color: #ca8a04; }

        .btn-reset {
            background-color: #ef4444;
            color: white;
        }
        .btn-reset:hover { background-color: #dc2626; }

        /* ផ្នែកបញ្ជីកិច្ចការត្រូវធ្វើ (To-Do List) */
        .task-section {
            text-align: left;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1.5rem;
        }

        .task-title {
            font-size: 1rem;
            margin-bottom: 10px;
            color: #94a3b8;
        }

        .task-input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 0.9rem;
        }

        .btn-add {
            background-color: #38bdf8;
            color: #0f172a;
        }
        .btn-add:hover { background-color: #0ea5e9; }

        ul.task-list {
            list-style: none;
            max-height: 150px;
            overflow-y: auto;
        }

        ul.task-list li {
            background: rgba(15, 23, 42, 0.6);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="study-container">
        <h1>📚 កម្មវិធីកំណត់ម៉ោងសិក្សា</h1>
        
        <!-- Timer -->
        <div class="timer-display" id="timer">25:00</div>
        <div class="timer-buttons">
            <button class="btn-start" id="startBtn">ចាប់ផ្តើម</button>
            <button class="btn-pause" id="pauseBtn">ផ្អាក</button>
            <button class="btn-reset" id="resetBtn">សារថ្មី</button>
        </div>

        <!-- Task List -->
        <div class="task-section">
            <div class="task-title">📝 កិច្ចការត្រូវធ្វើថ្ងៃនេះ៖</div>
            <div class="task-input-group">
                <input type="text" id="taskInput" placeholder="បញ្ចូលមេរៀន ឬកិច្ចការ...">
                <button class="btn-add" id="addBtn">បន្ថែម</button>
            </div>
            <ul class="task-list" id="taskList"></ul>
        </div>
    </div>

    <script>
        // កូដគ្រប់គ្រងម៉ោង (Timer Logic)
        let timeLeft = 1500; // 25 នាទី
        let timerId = null;
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');

        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        startBtn.addEventListener('click', () => {
            if (timerId !== null) return;
            timerId = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimer();
                } else {
                    clearInterval(timerId);
                    timerId = null;
                    alert("🎉 អបអរសាទរ! หมดពេលសិក្សាហើយ សម្រាកបន្តិចសិន!");
                }
            }, 1000);
        });

        pauseBtn.addEventListener('click', () => {
            clearInterval(timerId);
            timerId = null;
        });

        resetBtn.addEventListener('click', () => {
            clearInterval(timerId);
            timerId = null;
            timeLeft = 1500;
            updateTimer();
        });

        // កូដគ្រប់គ្រងបញ្ជីកិច្ចការ (To-Do List Logic)
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');

        addBtn.addEventListener('click', () => {
            const taskText = taskInput.value.trim();
            if (taskText === "") return;

            const li = document.createElement('li');
            li.innerHTML = `<span>${taskText}</span> <button class="delete-btn">&times;</button>`;
            
            li.querySelector('.delete-btn').addEventListener('click', () => {
                li.remove();
            });

            taskList.appendChild(li);
            taskInput.value = "";
        });

        updateTimer();
    </script>

</body>
</html>
