<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ផ្ទះវីឡាពេលយប់ និងភ្លើងបំភ្លឺ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Khmer OS Battambang', sans-serif;
        }

        body {
            background: linear-gradient(to bottom, #090d16, #1e1b4b);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* បរិយាកាសពេលយប់មានផ្កាយព្រិចៗ */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(white 1px, transparent 0);
            background-size: 50px 50px;
            opacity: 0.2;
            animation: twinkle 4s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.1; }
            100% { opacity: 0.3; }
        }

        .scene-container {
            text-align: center;
            z-index: 2;
        }

        /* រចនាសម្ព័ន្ធផ្ទះ */
        .house-wrapper {
            position: relative;
            width: 320px;
            height: 260px;
            margin: 0 auto 1.5rem auto;
            cursor: pointer;
        }

        /* ដំបូលផ្ទះ */
        .roof {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 180px solid transparent;
            border-right: 180px solid transparent;
            border-bottom: 80px solid #334155;
            transition: border-bottom-color 0.4s;
        }

        /* ជញ្ជាំងផ្ទះ */
        .walls {
            position: absolute;
            bottom: 0;
            left: 30px;
            width: 260px;
            height: 180px;
            background: #1e293b;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 20px;
            transition: background 0.4s, box-shadow 0.4s;
        }

        /* ទ្វារផ្ទះ */
        .door {
            width: 50px;
            height: 80px;
            background: #0f172a;
            border-radius: 4px 4px 0 0;
            transition: background 0.4s, box-shadow 0.4s;
        }

        /* បង្អួចផ្ទះ (ឆ្វេង និងស្តាំ) */
        .window {
            position: absolute;
            top: 40px;
            width: 55px;
            height: 60px;
            background: #0f172a;
            border: 4px solid #475569;
            border-radius: 6px;
            transition: all 0.4s;
        }

        .window.left { left: 30px; }
        .window.right { right: 30px; }

        /* ស្ថានភាពពេលបើកភ្លើងក្នុងផ្ទះ (ON) */
        .house-wrapper.on .roof {
            border-bottom-color: #475569;
        }

        .house-wrapper.on .walls {
            background: #334155;
            box-shadow: 0 0 50px rgba(250, 204, 21, 0.4), 0 10px 30px rgba(0,0,0,0.8);
        }

        .house-wrapper.on .window {
            background: #facc15;
            border-color: #ca8a04;
            box-shadow: 0 0 25px #facc15, inset 0 0 10px #fff;
        }

        .house-wrapper.on .door {
            background: #eab308;
            box-shadow: 0 0 15px #facc15;
        }

        /* អត្ថបទបង្ហាញ */
        .title {
            color: #f8fafc;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 0.4rem;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="scene-container">
        <!-- ផ្ទះវីឡា -->
        <div class="house-wrapper" id="house">
            <div class="roof"></div>
            <div class="walls">
                <div class="window left"></div>
                <div class="door"></div>
                <div class="window right"></div>
            </div>
        </div>

        <div class="title">ផ្ទះវីឡាទំនើបពេលយប់</div>
        <div class="subtitle" id="statusText">🏠 សូមចុចលើខ្នងផ្ទះដើម្បី បើក/បិទ ភ្លើងក្នុងផ្ទះ!</div>
    </div>

    <script>
        const house = document.getElementById('house');
        const statusText = document.getElementById('statusText');

        // បង្កើតសំឡេងកុងតាក់ពេលចុច
        function playSwitchSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {}
        }

        house.addEventListener('click', () => {
            playSwitchSound();
            house.classList.toggle('on');

            if (house.classList.contains('on')) {
                statusText.innerHTML = "✨ ភ្លើងក្នុងផ្ទះត្រូវបានបើក បំភ្លឺយ៉ាងស្រស់ស្អាត!";
                statusText.style.color = "#facc15";
            } else {
                statusText.innerHTML = "🏠 សូមចុចលើខ្នងផ្ទះដើម្បី បើក/បិទ ភ្លើងក្នុងផ្ទះ!";
                statusText.style.color = "#94a3b8";
            }
        });
    </script>

</body>
</html>
