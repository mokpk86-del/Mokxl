<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Digital Rain - កូដកាឡាក់ស៊ីឌីជីថល</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }

        canvas {
            display: block;
        }

        .overlay-text {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff66;
            font-family: 'Khmer OS Battambang', sans-serif;
            font-size: 1.2rem;
            text-align: center;
            text-shadow: 0 0 10px #00ff66;
            z-index: 10;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #00ff66;
        }
    </style>
</head>
<body>

    <div class="overlay-text">⚡ ប្រព័ន្ធកាឡាក់ស៊ីឌីជីថល កំពុងដំណើរការ...</div>
    <canvas id="matrixCanvas"></canvas>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        // កំណត់ទំហំ Canvas ឱ្យពេញអេក្រង់
        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;

        // តួអក្សរ និងលេខកូដសម្រាប់ទម្លាក់ចុះក្រោម
        const characters = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz@#$%^&*()_+-=[]{}|;:,.<>/?MOKXL";
        const fontSize = 16;
        const columns = canvas.width / fontSize;

        // បង្កើតតារាងទីតាំងជួរឈរ
        const drops = [];
        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            // បង្កើតបែបផែនម្លប់រសាត់ (Trailing effect)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff66'; // ពណ៌ខៀវខ្ចី/បៃតងបែបឌីជីថល
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                // ជ្រើសរើសតួអក្សរចៃដន្យ
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                
                // គូរអក្សរចុះក្រោម
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                // បញ្ជូនជួរឈរត្រឡប់ឡើងលើវិញពេលធ្លាក់ដល់បាត
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }

                drops[i]++;
            }
        }

        // ល្បឿនចលនាធ្លាក់
        setInterval(drawMatrix, 30);

        // កែតម្រូវទំហំអេក្រង់อัตโนมัติពេលបង្វិលទូរស័ព្ទ
        window.addEventListener('resize', () => {
            canvas.height = window.innerHeight;
            canvas.width = window.innerWidth;
        });
    </script>

</body>
</html>
